[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pra-psv"
version = "0.1.0"
description = "Prefix Risk Adapter and PRA-guided Selective Verification"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "torch>=2.6,<3"]

[project.optional-dependencies]
encoder = ["transformers>=4.45,<5", "accelerate>=0.28,<2", "safetensors>=0.4"]
dev = ["pytest>=7"]

[project.scripts]
pra-psv = "pra_psv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

